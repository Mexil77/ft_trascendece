server {
    listen 80;

    location /api/auth/ {
        proxy_pass http://auth-service:3001/;
        rewrite ^/api/auth/?(.*)$ /$1 break;
    }

    location /api/users/ {
        proxy_pass http://user-service:3002/;
        rewrite ^/api/users/?(.*)$ /$1 break;
    }

    location / {
        return 404;
    }
}
